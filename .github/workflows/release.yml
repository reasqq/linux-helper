name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: ubuntu-24.04
            script: dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-helper-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-helper-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: Linux Helper ${{ github.ref_name }}
          body: |
            Первый выпуск Linux Helper: 100 уроков на русском языке, 16 учебных путей в пяти этапах, 42 инструмента и 21 метод пентеста в справочниках, расширенный поиск, интерактивная схема chmod, самопроверка, правовые нормы и локальный прогресс с XP.

            Windows 10: скачайте portable .exe или установщик .exe.
            Kali Linux: скачайте .AppImage (после загрузки выполните `chmod +x Linux-Helper-*.AppImage`) или пакет .deb.

            Приложение работает офлайн. Windows и Linux пакеты собраны в GitHub Actions; файлы не подписаны цифровой подписью.
          files: release/*
